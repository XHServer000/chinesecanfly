name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to only upload the jar as an artifact.'
        required: false
        default: ''

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: chinesecanfly-jars
          path: build/libs/chinesecanfly-*.jar
          if-no-files-found: error

      # 发布到 Modrinth（仅当设置了 MODRINTH_TOKEN 时执行）
      - name: Publish to Modrinth
        if: ${{ secrets.MODRINTH_TOKEN != '' }}  # 如果没有Token则跳过
        uses: Kira-NT/mc-publish@v3
        with:
          # ---------- 必填项 ----------
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}  # 项目ID存为Secret
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # 只上传编译后的主JAR，排除源码、dev、javadoc等
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          # ---------- 版本信息 ----------
          # 版本号：优先使用输入的tag，去掉前缀v（如v1.0.0 -> 1.0.0）
          version: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('{0}+build.{1}', '0.0.0', github.run_number) }}
          # 版本名称：默认与tag相同，或使用构建号
          version-name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || format('Build #{0}', github.run_number) }}


          changelog: ${{ github.event.inputs.tag != '' && format('See [release notes](https://github.com/{0}/releases/tag/{1})', github.repository, github.event.inputs.tag) || 'Manual build' }}

          # ---------- 游戏环境和加载器（请根据模组实际情况修改） ----------
          game-versions: |
            1.21.11
          loaders: |
            fabric

          # 发布类型：如果tag是预发布版（如包含-alpha/beta），则设为beta，否则release
          version-type: ${{ contains(github.event.inputs.tag, 'alpha') || contains(github.event.inputs.tag, 'beta') && 'beta' || 'release' }}

      # 创建 GitHub Release（与原来一致）
      - name: Create GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: build/libs/chinesecanfly-*.jar
          generate_release_notes: true